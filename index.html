<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>2. Bridge Defender</title><style>body{background:#0b0e14;color:#fff;font-family:sans-serif;text-align:center;}canvas{background:#121824;border:2px solid #0052FF;}</style></head>
<body>
<h1>2. ETH Bridge Defender</h1>
<canvas id="c" width="300" height="300"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
let px=110, bx=150, by=150, dx=2, dy=-2;
document.onmousemove = e => px = e.clientX - 40;
function loop() {
    ctx.clearRect(0,0,300,300);
    bx += dx; by += dy;
    if(bx<0||bx>300) dx=-dx; if(by<0) dy=-dy;
    if(by>280 && bx>px && bx<px+80) dy=-dy;
    ctx.fillStyle='#0052FF'; ctx.fillRect(px, 285, 80, 10);
    ctx.fillStyle='#00D1FF'; ctx.beginPath(); ctx.arc(bx, by, 5, 0, 7); ctx.fill();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
